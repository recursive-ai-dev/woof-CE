#==========================================================================
# Guardian kernel build configuration (woof-CE kernel-kit)
#
# Minimal, hardened, modules-enabled, x86_64 UEFI kernel for the
# Guardian Puppy.  Designed to be built non-interactively:
#
#   cd kernel-kit && ./build.sh guardian-build.conf auto
#
# Summary of the design (see configs_x86_64/DOTconfig-*.x86_64-guardian):
#   * CONFIG_MODULES=y - modules are used, in a separate kernel-modules SFS
#     (zdrv), not built into vmlinuz.
#   * All NIC, WLAN, Bluetooth, modern media/audio and most exotic drivers
#     are DISABLED so there is no network hardware support at all
#     ("close to airgapped"): only the in-kernel loopback stack remains.
#   * Boot-critical drivers are built-in (SATA/NVMe/USB storage, ext4,
#     vfat, iso9660, squashfs, AUFS, overlayfs, EFI framebuffer,
#     simpledrm, USB HID/keyboard, serial console).
#   * Only Intel i915, AMD amdgpu, NVIDIA nouveau plus the common VM GPUs
#     (vmwgfx/qxl/virtio-gpu/bochs) are kept as modules.
#   * Hardening: RANDOMIZE_BASE, SMAP/UMIP, PTI, retpoline, spectre-BHI
#     mitigations, stack protector strong, FORTIFY, init-on-alloc/free,
#     slab freelist hardening, module signatures ENFORCED, kernel
#     lockdown LSM (enable with `lockdown=integrity` on the command line),
#     dmesg restriction, no kexec.
#==========================================================================

## use the Guardian kernel config
DOTconfig_file=configs_x86_64/DOTconfig-6.12.2-x86_64-guardian

## fully automated - no interactive prompts
AUTO=yes

## output package name: huge-6.12.2-guardian.tar.bz2
package_name_suffix=guardian
custom_suffix=

## kernel command-line hardening that is applied by default at boot
## (see woof-code/support/mk_iso.sh EXTRA_KERNEL_PARAMS)
#EXTRA_KERNEL_PARAMS_DOC="lockdown=integrity"

## no firmware download: airgap build - no NIC/WiFi drivers, so no
## firmware is needed and the fdrv will be empty
fware=n
EXTRA_FW=no

## don't produce the huge kernel sources/kbuild SFS (saves time/disk);
## uncomment if you later want to build third-party out-of-tree modules
CREATE_SOURCES_SFS=no
CREATE_KBUILD_SFS=no

## kernel modules package compression
COMP="-comp xz -b 256K"

## don't strip modules (safer)
STRIP_KMODULES=no

## parallelism (leave unset to use nproc)
#JOBS=-j$(nproc)
