#
#  persistent configuration options - Guardian (airgap) x86_64
#
#  see also DISTRO_SPECS DISTRO_PET_REPOS DISTRO_COMPAT_REPOS-*
#

# 2createpackages
STRIP_BINARIES=no

## Kernel tarballs repo URL
KIT_KERNEL_REPO_URL=http://distro.ibiblio.org/puppylinux/huge_kernels
## Only uncomment for a prebuilt kernel:
#KERNEL_TARBALL_URL=https://distro.ibiblio.org/puppylinux/huge_kernels/huge-6.12.2-guardian.tar.bz2

## no extra packages on the a/f/y drives
ADRV_INC=""
YDRV_INC=""
FDRV_INC=""

## kernel-kit generated fdrive: never include one (airgap = no firmware)
KFDRIVE=no

## build devx? (needed to build the petbuilds inside 3builddistro)
BUILD_DEVX=yes
## include devx SFS in ISO? no - keep the ISO lean
DEVX_IN_ISO=no

## symlink /bin, /sbin and /lib to their /usr counterparts, like Debian?
USR_SYMLINKS=yes

## no extra bdrv drive
BUILD_BDRV=no

## GTK+ version used when building packages that support GTK+ 2
PETBUILD_GTK=3

## Windows installer is irrelevant for the Guardian build
LICK_IN_ISO=no

## compression method used for the SFS files
SFSCOMP='-comp zstd -Xcompression-level 19 -b 256K -no-exports -no-xattrs'

EXTRA_STRIPPING=no

## theme selection (the theme packages are in PETBUILDS above)
PTHEME=""
THEME_WALLPAPER="431-dark.svg"
THEME_GTK2="Numix"
THEME_JWM="Breeze"
THEME_JWM_BUTTONS="Breeze"
THEME_GTK_ICONS="PMaterial"
THEME_DESK_ICONS="PMaterial"
THEME_MOUSE="Breeze_Snow"

## no Pkg (package manager) - keep the system minimal
INCLUDE_PKG=n

## no ucode.cpio in this build
#UCODE_EXEC=../support/latest_microcode.sh amd

## 64-bit UEFI only
#UEFI_32=y

## extra kernel command line for every boot entry (see support/mk_iso.sh).
## `lockdown=integrity' enforces verified kernel modules at boot and is the
## recommended Guardian default; leave it empty if the modules fail to load.
EXTRA_KERNEL_PARAMS="lockdown=integrity"

## -- Default Apps -- (no browser/network apps by default)
DEFAULTAPPS="
defaultarchiver=xarchiver
defaultaudiomixer=
defaultaudioplayer=
defaultbrowser=
defaultcalculator=
defaultcalendar=
defaultcdplayer=
defaultcdrecorder=
defaultchat=
defaultchmviewer=
defaultconnect=
defaultcontact=
defaultdraw=
defaultemail=
defaultfilemanager=rox
defaultfontmanager=
defaulthandler=
defaulthtmleditor=geany
defaulthtmlviewer=
defaultimageeditor=mtpaint
defaultimageviewer=mtpaint
defaultmediaplayer=
defaultpaint=mtpaint
defaultpdfviewer=
defaultprocessmanager=lxtask
defaultrun=
defaultscreenshot=
defaultspreadsheet=
defaultterminal=lxterminal
defaulttexteditor=geany
defaulttextviewer=geany
defaulttorrent=
defaultwordprocessor=
"

## CLI prompt
PROMPT='PS1="\[\e[1;32m\]\u@Guardian\[\e[0m\]:\[\e[1;34m\]\w\[\e[0m\]\$ "'

## extra ISO name flag
#XTRA_FLG='-airgap'

## - extra commands --
## Run inside sandbox3/rootfs-complete. Firewall on, local-only hosts,
## no network managers, minimal cleanup.
EXTRA_COMMANDS="
echo 'Guardian System built on: $(date)' >> etc/system_build_date
chroot . /usr/sbin/firewall_ng enable
cat > etc/hosts <<'_HOSTS_EOF'
127.0.0.1	localhost	guardian
::1		localhost	guardian
_HOSTS_EOF
rm -f etc/localtime
ln -s /usr/share/zoneinfo/Etc/GMT-0 etc/localtime
for i in usr/share/themes/*; do case \"\$i\" in usr/share/themes/Default|usr/share/themes/Emacs|usr/share/themes/Flat-grey-rounded|usr/share/themes/Polished-Blue|usr/share/themes/Gradient-grey|usr/share/themes/buntoo-ambience|usr/share/themes/stark-blueish|usr/share/themes/Numix) ;; *) rm -vrf \"\$i\" ;; esac; done
rm -vf usr/share/backgrounds/*.jpg
rm -f etc/fonts/conf.d/10-hinting-slight.conf etc/fonts/conf.d/10-autohint.conf
ln -s ../conf.avail/10-hinting-none.conf etc/fonts/conf.d/
rm -f var/packages/Packages-ubuntu-*
truncate -s 0 var/packages/Packages-*
"
